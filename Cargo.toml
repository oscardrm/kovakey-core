[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["sqlcipher"]
# Encrypted on-disk database. Native targets only (not wasm32).
sqlcipher = ["dep:rusqlite"]
# Google Drive (appDataFolder) storage provider (ADR 0010). Pure logic over an injected HTTP transport.
gdrive = []

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
thiserror = "2"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
uuid = { version = "1", features = ["v7"] }
# Snapshot wire format (ADR 0001): compact, deterministic, no_std-friendly, wasm-safe.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Import parsing (ADR 0005): JSON only, no_std-friendly, wasm-safe.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v7", "js"] }

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
